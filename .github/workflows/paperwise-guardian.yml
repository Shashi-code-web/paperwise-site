name: Paperwise Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'app.js'
      - 'admin.js'
      - 'config.js'
      - 'api/**'
      - '.github/workflows/paperwise-guardian.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: paperwise-guardian
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check storefront, admin and backend
        id: check
        env:
          STOREFRONT_URL: https://paperwise-store.pages.dev
          API_URL: https://paperwise-api.vercel.app
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          base=os.environ['STOREFRONT_URL']
          api=os.environ['API_URL']
          checks=[
            ('storefront', base+'/', 'text/html', b'Paperwise'),
            ('admin', base+'/admin.html', 'text/html', b'admin'),
            ('browser config', base+'/config.js', 'javascript', b'PAPERWISE_API_BASE'),
            ('payment settings API', api+'/api/payment-settings', 'application/json', None),
          ]
          failures=[]
          for name,url,mime,marker in checks:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'PaperwiseGuardian/1.0','Accept':'*/*'})
              with urllib.request.urlopen(request,timeout=18) as response:
                body=response.read(150000)
                ct=response.headers.get('Content-Type','').lower()
                if response.status!=200: raise ValueError('HTTP '+str(response.status))
                if mime not in ct: raise ValueError('unexpected content type: '+ct)
                if marker and marker.lower() not in body.lower(): raise ValueError('expected page content missing')
                if name=='payment settings API':
                  data=json.loads(body)
                  if not isinstance(data.get('enabled'),bool): raise ValueError('invalid payment settings response')
                print('PASS:',name)
            except Exception as e:
              failures.append(name+': '+str(e))
              print('FAIL:',name,repr(e))
          if failures:
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Paperwise Guardian: failed checks\\n'+'\\n'.join('- '+x for x in failures)+'\\n')
            sys.exit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Paperwise Guardian: all 4 public smoke checks passed\\n')
          PY

      - name: Create or update an issue when checks fail
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search 'Paperwise Guardian smoke check failed in:title' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title 'Paperwise Guardian smoke check failed' --body "One or more public health checks failed. See the [workflow run]($RUN_URL) for details. Investigate before deploying. Never paste secrets or customer data into this issue."
          else
            gh issue comment "$existing" --body "Smoke check failed again: [workflow run]($RUN_URL)."
          fi
